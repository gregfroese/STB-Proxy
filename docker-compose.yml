# Quick start: set HOST below, then run `docker compose up -d` and open http://<HOST>/
services:
  stb-proxy:
    build: .
    image: stb-proxy
    # Rebuild from the code on every `up`, so `git pull && docker compose up -d` updates it.
    pull_policy: build
    container_name: stb-proxy
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # The address your players (Plex, VLC, a browser) use to reach STB-Proxy.
      # It goes into the playlist and tuner links, so use this machine's LAN address.
      HOST: "192.168.1.10:8001"
      # Your time zone, for the guide and logs.
      TZ: "Etc/UTC"
    volumes:
      # Portals, edits and settings (config.json), plus an optional devices.json.
      - ./config:/config
