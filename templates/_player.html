<!-- Channel preview, docked in the corner so the page stays usable while it plays.
     Also shows the playing channel's guide, and guideButton(row) opens any listed channel's guide.
     Shared by the editor, blocks and guide pages.
     A page that includes this defines rowFor(ch), returning the channel's data row
     ({portal, channelId, channelName, customChannelName, link, dead, favourite, blocks}) or null,
     and channelChanged(row, previousBlocks, before), called after a dead mark, favourite or the
     channel's blocks are saved (previousBlocks only when the blocks changed; before = {dead}
     only when the dead mark was saved).
     Channel up/down moves through the play buttons inside the .channel-list element the
     channel was started from, unless the page defines channelList(), returning its channels
     in order, and optionally channelShown(ch), called when a channel starts playing, and
     channelNodes(), returning list rows that aren't in the page (other table pages).
     The page passes allBlocks, every block name, to the template. -->
<style>
    .player-panel {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: min(440px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        z-index: 1040;
        background-color: #2c3034;
        border: 1px solid #495057;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.6);
    }
    .player-panel .text-muted {
        color: #adb5bd !important;
    }
    .player-panel.minimised .player-controls {
        display: none;
    }
    .play-button.playing {
        box-shadow: 0 0 0 0.2rem #ffc107;
    }
    .channel-logo {
        width: 48px;
        height: 28px;
        object-fit: contain;
        flex-shrink: 0;
    }
    /* Most logos are made for a light background; dark ones vanish on this page's. */
    img.channel-logo {
        padding: 2px;
        border-radius: 3px;
        background-color: #f8f9fa;
    }
    .player-guide {
        max-height: 220px;
        overflow-y: auto;
        border-bottom: 1px solid #495057;
    }
    .player-panel.minimised .player-guide {
        display: none;
    }
    .programme {
        padding: 0.35rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .programme:last-child {
        border-bottom: 0;
    }
    .programme-desc {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .channel-guide-modal .text-muted {
        color: #adb5bd !important;
    }

    /* Full screen: the whole panel fills the screen, its title bar and controls float over the video. */
    .player-panel:fullscreen {
        width: 100vw;
        height: 100vh;
        max-height: none;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background-color: #000;
    }
    .player-panel:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
        max-height: none;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background-color: #000;
    }
    .player-panel.fullscreen video {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    .player-panel.fullscreen .player-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2;
        padding: 1rem !important;
        font-size: 1.25rem;
        background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0));
    }
    .player-panel.fullscreen .player-controls {
        display: block;
        position: absolute;
        left: 1rem;
        bottom: 4.5rem;
        z-index: 2;
        width: min(520px, calc(100vw - 2rem));
        border-radius: 0.5rem;
        background-color: rgba(33, 37, 41, 0.85);
    }
    .player-panel.fullscreen .player-guide {
        position: absolute;
        top: 5rem;
        right: 1rem;
        z-index: 2;
        width: min(420px, calc(100vw - 2rem));
        max-height: calc(100vh - 11rem);
        border: 0;
        border-radius: 0.5rem;
        background-color: rgba(33, 37, 41, 0.85);
    }
    .player-panel.fullscreen.minimised .player-guide:not(.d-none) {
        display: block;
    }
    .player-panel.fullscreen #minimiseButton {
        display: none;
    }
    .player-panel.fullscreen .player-header,
    .player-panel.fullscreen .player-controls,
    .player-panel.fullscreen .player-guide {
        transition: opacity 0.3s;
    }
    .player-panel.fullscreen.idle .player-header,
    .player-panel.fullscreen.idle .player-controls,
    .player-panel.fullscreen.idle .player-guide {
        opacity: 0;
        pointer-events: none;
    }
    .player-panel.fullscreen.idle {
        cursor: none;
    }
</style>

<div class="player-panel text-light d-none" id="playerPanel" role="region" aria-labelledby="channelLabel">
    <div class="player-header d-flex align-items-center p-2">
        <img class="channel-logo me-2 d-none" id="playerLogo" alt="" onerror="this.classList.add('d-none')">
        <div class="text-truncate me-2">
            <div class="fw-bold text-truncate" id="channelLabel">Channel</div>
            <div class="small text-muted text-truncate" id="nowShowing"></div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-light ms-auto" id="channelDown"
            onclick="changeChannel(-1)" title="Channel down: previous in the list (Page Down)"><i class="fa fa-chevron-down"></i></button>
        <button type="button" class="btn btn-sm btn-outline-light ms-1" id="channelUp"
            onclick="changeChannel(1)" title="Channel up: next in the list (Page Up)"><i class="fa fa-chevron-up"></i></button>
        <button type="button" class="btn btn-sm btn-outline-info ms-1" id="guideButton"
            onclick="togglePlayerGuide()" title="This channel's guide (G)"><i class="fa fa-list-alt"></i></button>
        <button type="button" class="btn btn-sm btn-outline-warning ms-1" id="favouriteButton"
            onclick="toggleFavourite()" title="Favourite"><i class="fa fa-star-o"></i></button>
        <button type="button" class="btn btn-sm btn-outline-light ms-1" id="fullscreenButton"
            onclick="toggleFullscreen()" title="Full screen (F)"><i class="fa fa-expand"></i></button>
        <button type="button" class="btn btn-sm btn-outline-light ms-1" id="multiviewButton"
            onclick="sendToMultiview()" title="Send to Multiview" aria-label="Send to Multiview"><i class="fa fa-th"></i></button>
        <button type="button" class="btn btn-sm btn-outline-light ms-1" id="minimiseButton"
            onclick="toggleMinimised()" title="Hide controls"><i class="fa fa-window-minimize"></i></button>
        <button type="button" class="btn btn-sm btn-outline-light ms-1" id="closePlayer"
            onclick="closePlayer()" title="Stop and close"><i class="fa fa-times"></i></button>
    </div>
    <!-- The browser's own full screen would show the video alone, without the controls above. -->
    <video width="100%" id="player" class="d-block bg-black" controls controlslist="nofullscreen" autoplay playsinline>
        Your browser does not support HTML video.
    </video>
    <div class="player-guide p-2 d-none" id="playerGuide"></div>
    <div class="player-controls p-2">
        <div class="small text-muted mb-1">Blocks</div>
        <div id="blockChoices" data-blocks='{{ allBlocks|tojson }}'></div>
        <div class="input-group input-group-sm mt-2" style="max-width: 320px;">
            <input type="text" class="form-control" id="newBlock" placeholder="New block">
            <button class="btn btn-outline-light" type="button" id="addBlockButton" onclick="addBlock()">Add</button>
        </div>
        <div id="blockStatus" class="small mt-1"></div>
        <div class="d-flex align-items-center flex-wrap mt-2">
            <span id="previewProblem" class="me-auto small text-warning d-none"><span id="previewProblemText"></span>
                <button type="button" class="btn btn-sm btn-outline-warning ms-1" id="retryPreview" onclick="retryPreview()">Try again</button>
            </span>
            <span id="deadStatus" class="me-auto small"></span>
            <button type="button" class="btn btn-sm btn-danger ms-auto mt-1" id="deadButton" onclick="toggleDead()">Mark dead</button>
        </div>
    </div>
</div>

<!-- One channel's schedule, opened from a channel list without playing it. -->
<div class="modal fade" id="channelGuideModal" tabindex="-1" aria-labelledby="channelGuideTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content bg-dark text-light channel-guide-modal">
            <div class="modal-header">
                <h5 class="modal-title text-truncate" id="channelGuideTitle">Guide</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="channelGuideBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" onclick="playFromGuide()"><i class="fa fa-play"></i> Play</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='multiview.js') }}"></script>
<script>
    var player = document.getElementById("player");
    var title = document.getElementById("channelLabel");
    player.volume = 0.25;
    var currentChannel = null;
    var currentLink = "";
    var previewTimer = null;
    var allBlocks = JSON.parse(document.getElementById("blockChoices").getAttribute("data-blocks"));

    function escapeAttr(s) {
        return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function channelKey(row) {
        return row.portal + '/' + row.channelId;
    }

    function playButton(row) {
        var playing = currentChannel && channelKey(currentChannel) == channelKey(row);
        return '<button class="btn btn-success btn-block play-button' + (playing ? ' playing' : '') + '" title="Play" ' +
            'onclick="selectChannel(this)" data-key="' + escapeAttr(channelKey(row)) + '" ' +
            'data-portal="' + escapeAttr(row.portal) + '" data-channelId="' + escapeAttr(row.channelId) + '">' +
            '<i class="fa fa-play"></i></button>';
    }

    // A channel's logo, or an empty space the same size so names line up.
    function logoImage(row) {
        if (!row.logo) {
            return '<span class="channel-logo d-inline-block"></span>';
        }
        return '<img class="channel-logo" loading="lazy" alt="" src="' + escapeAttr(row.logo) + '" ' +
            'onerror="this.style.visibility=\'hidden\'">';
    }

    function guideButton(row) {
        return '<button class="btn btn-link p-0 text-info guide-button" title="Guide" onclick="showChannelGuide(this)" ' +
            'data-portal="' + escapeAttr(row.portal) + '" data-channelId="' + escapeAttr(row.channelId) + '">' +
            '<i class="fa fa-list-alt"></i></button>';
    }

    function deadToggle(row) {
        return '<button class="btn btn-link p-0 dead-toggle ' + (row.dead ? 'text-danger' : 'text-secondary') + '" ' +
            'title="' + (row.dead ? 'Dead: click to mark working' : 'Mark dead') + '" onclick="deadClicked(this)" ' +
            'data-key="' + escapeAttr(channelKey(row)) + '" data-portal="' + escapeAttr(row.portal) + '" ' +
            'data-channelId="' + escapeAttr(row.channelId) + '"><i class="fa fa-ban"></i></button>';
    }

    function favouriteStar(row) {
        return '<button class="btn btn-link text-warning p-0 fav-star" title="Favourite" onclick="starClicked(this)" ' +
            'data-key="' + escapeAttr(channelKey(row)) + '" data-portal="' + escapeAttr(row.portal) + '" ' +
            'data-channelId="' + escapeAttr(row.channelId) + '">' +
            '<i class="fa ' + (row.favourite ? 'fa-star' : 'fa-star-o') + '"></i></button>';
    }

    function deadBadge(row) {
        return '<span class="badge bg-danger ms-2 dead-badge' + (row.dead ? '' : ' d-none') + '" ' +
            'data-key="' + escapeAttr(channelKey(row)) + '">dead</span>';
    }

    // Identifies this browser to the server, so a new preview stops only its own last one
    // (behind a reverse proxy, every viewer arrives from the same address).
    var viewerId = (function () {
        var id = null;
        try {
            id = localStorage.getItem("stbViewer");
        } catch (e) { }
        if (!id) {
            id = Math.random().toString(36).slice(2) + Date.now().toString(36);
            try {
                localStorage.setItem("stbViewer", id);
            } catch (e) { }
        }
        return id;
    })();

    var streamSeq = 0;
    var retried = false;
    var BUSY_MESSAGE = "Portal busy, trying again...";

    function stopStream() {
        streamSeq++;
        clearTimeout(previewTimer);
        // Dropping the source closes the stream, which frees the portal connection.
        player.pause();
        player.removeAttribute("src");
        player.load();
    }

    function startStream(delay) {
        var seq = ++streamSeq;
        setTimeout(function () {
            if (seq != streamSeq) {
                return;  // another channel was picked, or the player closed, meanwhile
            }
            player.src = currentLink + "&viewer=" + encodeURIComponent(viewerId) + "&tile=player";
            previewTimer = setTimeout(previewFailed, 15000);
        }, delay);
    }

    var currentList = null;
    var lastListIndex = 0;

    function selectChannel(ele) {
        currentList = ele.closest(".channel-list");
        playChannel({ portal: ele.getAttribute('data-portal'), channelId: ele.getAttribute('data-channelId') });
    }

    // The channels channel up/down moves through, in order, each listed once.
    function listedChannels() {
        var channels;
        if (typeof channelList == "function") {
            channels = channelList();
        } else {
            var scope = currentList && document.body.contains(currentList) ? currentList : document;
            channels = Array.prototype.map.call(scope.querySelectorAll(".play-button"), function (b) {
                return { portal: b.getAttribute("data-portal"), channelId: b.getAttribute("data-channelId") };
            });
        }
        var seen = {};
        return channels.filter(function (ch) {
            var key = channelKey(ch);
            if (seen[key]) {
                return false;  // the guide can list a channel once per programme
            }
            seen[key] = true;
            return true;
        });
    }

    function indexIn(channels, ch) {
        for (var i = 0; i < channels.length; i++) {
            if (channelKey(channels[i]) == channelKey(ch)) {
                return i;
            }
        }
        return -1;
    }

    function changeChannel(step) {
        if (!currentChannel) {
            return;
        }
        var channels = listedChannels();
        if (!channels.length) {
            return;
        }
        var index = indexIn(channels, currentChannel);
        // If the channel has left the list (say it was just put in a block while blocks are
        // hidden), carry on from the place it had.
        var target = index == -1 ? (step > 0 ? lastListIndex : lastListIndex - 1) : index + step;
        target = ((target % channels.length) + channels.length) % channels.length;
        playChannel(channels[target]);
    }

    document.addEventListener("keydown", function (event) {
        if (!currentChannel || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) {
            return;
        }
        if (event.key == "PageUp" || event.key == "PageDown") {
            event.preventDefault();
            changeChannel(event.key == "PageUp" ? 1 : -1);
        } else if (event.key == "f" || event.key == "F") {
            toggleFullscreen();
        } else if (event.key == "g" || event.key == "G") {
            togglePlayerGuide();
        }
        wakeOverlay();
    });

    function markPlaying() {
        var key = currentChannel ? channelKey(currentChannel) : null;
        var roots = [document].concat(typeof channelNodes == "function" ? channelNodes() : []);
        roots.forEach(function (root) {
            root.querySelectorAll(".play-button").forEach(function (b) {
                b.classList.toggle("playing", b.getAttribute("data-key") == key);
            });
        });
    }

    function playChannel(ch) {
        var row = rowFor(ch);
        if (!row) {
            return;
        }
        var index = indexIn(listedChannels(), row);
        if (index != -1) {
            lastListIndex = index;
        }
        stopStream();
        currentChannel = { portal: row.portal, channelId: row.channelId };
        currentLink = row.link;
        retried = false;
        // No need to wait for the last stream to close: the server stops it for us.
        startStream(0);
        showPlayer();
        title.textContent = row.customChannelName || row.channelName;
        var logo = document.getElementById("playerLogo");
        logo.classList.toggle("d-none", !row.logo);
        if (row.logo) {
            logo.src = row.logo;
        } else {
            logo.removeAttribute("src");
        }
        document.getElementById("nowShowing").textContent = "";
        showPlayerGuide(true);
        showDeadState(row.dead);
        showFavouriteState(row.favourite);
        renderBlockChoices(row);
        document.getElementById("blockStatus").textContent = "";
        document.getElementById("newBlock").value = "";
        document.getElementById("previewProblem").classList.add("d-none");
        document.getElementById("deadStatus").textContent = "";
        markPlaying();
        if (typeof channelShown == "function") {
            channelShown(row);
        }
    }

    player.addEventListener("playing", function () {
        clearTimeout(previewTimer);
        var status = document.getElementById("deadStatus");
        if (status.textContent == BUSY_MESSAGE) {
            status.textContent = "";
        }
    });

    player.addEventListener("error", function () {
        if (currentChannel && player.getAttribute("src")) {
            previewFailed();
        }
    });

    var panel = document.getElementById("playerPanel");

    function showPlayer() {
        if (panel.classList.contains("d-none") && window.innerHeight < 700) {
            // On a short screen the controls would cover the page; start with just the video.
            setMinimised(true);
        }
        panel.classList.remove("d-none");
        reservePlayerSpace();
    }

    // Leave room under the page so the player never hides the last rows.
    function reservePlayerSpace() {
        if (isFullscreen()) {
            return;
        }
        document.body.style.paddingBottom = panel.classList.contains("d-none") ? "" : (panel.offsetHeight + 32) + "px";
    }

    function isFullscreen() {
        return (document.fullscreenElement || document.webkitFullscreenElement) == panel;
    }

    function toggleFullscreen() {
        if (isFullscreen()) {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else if (panel.requestFullscreen || panel.webkitRequestFullscreen) {
            (panel.requestFullscreen || panel.webkitRequestFullscreen).call(panel);
        }
    }

    function fullscreenChanged() {
        if ((document.fullscreenElement || document.webkitFullscreenElement) == player) {
            // The video's own full screen button (some browsers keep it): show the whole player instead.
            var exit = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen();
            Promise.resolve(exit).then(toggleFullscreen);
            return;
        }
        var on = isFullscreen();
        panel.classList.toggle("fullscreen", on);
        var button = document.getElementById("fullscreenButton");
        button.innerHTML = '<i class="fa ' + (on ? 'fa-compress' : 'fa-expand') + '"></i>';
        button.title = on ? "Leave full screen (F)" : "Full screen (F)";
        wakeOverlay();
        reservePlayerSpace();
    }

    document.addEventListener("fullscreenchange", fullscreenChanged);
    document.addEventListener("webkitfullscreenchange", fullscreenChanged);
    player.addEventListener("dblclick", toggleFullscreen);

    // In full screen the title bar and controls fade out after a few seconds without the mouse.
    var idleTimer = null;

    function wakeOverlay() {
        panel.classList.remove("idle");
        clearTimeout(idleTimer);
        if (isFullscreen()) {
            idleTimer = setTimeout(goIdle, 3000);
        }
    }

    function goIdle() {
        var overlays = panel.querySelectorAll(".player-header, .player-controls, .player-guide");
        var inUse = Array.prototype.some.call(overlays, function (e) { return e.matches(":hover"); }) ||
            document.activeElement == document.getElementById("newBlock");
        if (inUse) {
            idleTimer = setTimeout(goIdle, 3000);
        } else if (isFullscreen()) {
            panel.classList.add("idle");
        }
    }

    panel.addEventListener("mousemove", wakeOverlay);
    panel.addEventListener("touchstart", wakeOverlay);

    if (window.ResizeObserver) {
        new ResizeObserver(reservePlayerSpace).observe(panel);
    }

    function closePlayer() {
        if (isFullscreen()) {
            toggleFullscreen();
        }
        currentChannel = null;
        markPlaying();
        stopStream();
        panel.classList.add("d-none");
        reservePlayerSpace();
    }

    function toggleMinimised() {
        setMinimised(!panel.classList.contains("minimised"));
    }

    function setMinimised(minimised) {
        panel.classList.toggle("minimised", minimised);
        var button = document.getElementById("minimiseButton");
        button.innerHTML = '<i class="fa ' + (minimised ? 'fa-window-restore' : 'fa-window-minimize') + '"></i>';
        button.title = minimised ? "Show controls" : "Hide controls";
    }

    var PROBLEMS = {
        failed: "This channel didn't play. The portal may just be busy: try again in a few seconds before marking it dead.",
        busy: "No free tuner: they're all in use (Plex, Multiview or another browser). Try again when one frees up.",
        client: "Plex or another player needed this tuner.",
        recording: "A recording needed this tuner.",
    };

    function previewFailed() {
        clearTimeout(previewTimer);
        if (!currentChannel) {
            return;
        }
        var row = rowFor(currentChannel);
        if (!row || row.dead) {
            return;
        }
        var seq = streamSeq;
        $.getJSON("/preview/status", { viewer: viewerId, tile: "player" })
            .then(function (res) { return res.reason; }, function () { return $.Deferred().resolve(null); })
            .done(function (reason) {
                if (seq != streamSeq) {
                    return;  // another channel was picked meanwhile
                }
                var action = multiview.failureAction(reason, retried);
                if (action == "retry") {
                    // Usually the portal connection is still busy with the last stream: try once more.
                    retried = true;
                    stopStream();
                    document.getElementById("deadStatus").textContent = BUSY_MESSAGE;
                    startStream(3000);
                    return;
                }
                stopStream();
                document.getElementById("deadStatus").textContent = "";
                document.getElementById("previewProblemText").textContent = PROBLEMS[action];
                document.getElementById("previewProblem").classList.remove("d-none");
                setMinimised(false);
            });
    }

    function retryPreview() {
        document.getElementById("previewProblem").classList.add("d-none");
        retried = false;
        stopStream();
        startStream(0);
    }

    // Move the channel playing here to Multiview, which opens with it in a tile.
    function sendToMultiview() {
        if (!currentChannel) {
            return;
        }
        var ch = currentChannel;
        closePlayer();  // frees its tuner for the tile
        multiview.addChannel(multiview.browserStorage(), ch);
        location.href = "/multiview";
    }

    function showDeadState(dead) {
        var button = document.getElementById("deadButton");
        button.textContent = dead ? "Mark working" : "Mark dead";
        button.className = (dead ? "btn btn-sm btn-success" : "btn btn-sm btn-danger") + " ms-auto mt-1";
    }

    function showFavouriteState(favourite) {
        var button = document.getElementById("favouriteButton");
        button.innerHTML = '<i class="fa ' + (favourite ? 'fa-star' : 'fa-star-o') + '"></i>';
        button.title = favourite ? "Remove from favourites" : "Add to favourites";
        button.className = favourite ? "btn btn-sm btn-warning ms-1" : "btn btn-sm btn-outline-warning ms-1";
    }

    // Mark a channel dead or working (the opposite of what it is now), from the player or a list.
    function setDead(ch, button, done) {
        var row = rowFor(ch);
        if (!row) {
            return;
        }
        var wasDead = row.dead;
        button.disabled = true;
        $.post("/channel/dead", { portal: ch.portal, channelId: ch.channelId, dead: row.dead ? "false" : "true" })
            .done(function (res) {
                row.dead = res.dead;
                var key = channelKey(row);
                document.querySelectorAll('.dead-badge[data-key="' + key + '"]').forEach(function (badge) {
                    badge.classList.toggle("d-none", !res.dead);
                });
                document.querySelectorAll('.dead-toggle[data-key="' + key + '"]').forEach(function (toggle) {
                    toggle.classList.toggle("text-danger", res.dead);
                    toggle.classList.toggle("text-secondary", !res.dead);
                    toggle.title = res.dead ? "Dead: click to mark working" : "Mark dead";
                });
                if (currentChannel && channelKey(currentChannel) == key) {
                    showDeadState(res.dead);
                    document.getElementById("previewProblem").classList.add("d-none");
                }
                if (done) {
                    done(res);
                }
                channelChanged(row, undefined, { dead: wasDead });
            })
            .fail(function () {
                if (done) {
                    done(null);
                } else {
                    alert("Couldn't save. Try again.");
                }
            })
            .always(function () {
                button.disabled = false;
            });
    }

    function toggleDead() {
        var status = document.getElementById("deadStatus");
        setDead(currentChannel, document.getElementById("deadButton"), function (res) {
            status.textContent = !res ? "Couldn't save. Try again."
                : (res.dead ? "Marked dead." : "Marked working.") + (res.plex ? " " + res.plex : "");
        });
    }

    function deadClicked(ele) {
        setDead({ portal: ele.getAttribute('data-portal'), channelId: ele.getAttribute('data-channelId') }, ele);
    }

    function setFavourite(ch, button) {
        var row = rowFor(ch);
        if (!row) {
            return;
        }
        button.disabled = true;
        $.post("/channel/favourite", { portal: ch.portal, channelId: ch.channelId, favourite: row.favourite ? "false" : "true" })
            .done(function (res) {
                row.favourite = res.favourite;
                document.querySelectorAll('.fav-star[data-key="' + channelKey(row) + '"] i').forEach(function (icon) {
                    icon.className = 'fa ' + (res.favourite ? 'fa-star' : 'fa-star-o');
                });
                if (currentChannel && channelKey(currentChannel) == channelKey(row)) {
                    showFavouriteState(res.favourite);
                }
                channelChanged(row);
            })
            .fail(function () {
                alert("Couldn't save the favourite. Try again.");
            })
            .always(function () {
                button.disabled = false;
            });
    }

    function toggleFavourite() {
        setFavourite(currentChannel, document.getElementById("favouriteButton"));
    }

    function starClicked(ele) {
        setFavourite({ portal: ele.getAttribute('data-portal'), channelId: ele.getAttribute('data-channelId') }, ele);
    }

    function renderBlockChoices(row) {
        var container = document.getElementById("blockChoices");
        container.innerHTML = "";
        var names = allBlocks.slice();
        row.blocks.forEach(function (name) {
            if (names.indexOf(name) == -1) {
                names.push(name);
            }
        });
        names.sort(function (a, b) { return a.localeCompare(b); });
        if (!names.length) {
            container.innerHTML = '<span class="small text-muted">No blocks yet. Add one below.</span>';
        }
        names.forEach(function (name, i) {
            var div = document.createElement("div");
            div.className = "form-check form-check-inline";
            var input = document.createElement("input");
            input.type = "checkbox";
            input.className = "form-check-input block-choice";
            input.id = "blockChoice" + i;
            input.value = name;
            input.checked = row.blocks.indexOf(name) != -1;
            input.onchange = blockChoiceChanged;
            var label = document.createElement("label");
            label.className = "form-check-label";
            label.htmlFor = input.id;
            label.textContent = name;
            div.appendChild(input);
            div.appendChild(label);
            container.appendChild(div);
        });
    }

    function checkedBlocks() {
        var names = [];
        document.querySelectorAll(".block-choice").forEach(function (input) {
            if (input.checked) {
                names.push(input.value);
            }
        });
        return names;
    }

    function blockChoiceChanged() {
        saveChannelBlocks(checkedBlocks());
    }

    function addBlock() {
        var input = document.getElementById("newBlock");
        var names = checkedBlocks();
        input.value.split(",").forEach(function (name) {
            name = name.trim();
            if (name && names.indexOf(name) == -1) {
                names.push(name);
            }
        });
        input.value = "";
        saveChannelBlocks(names);
    }

    document.getElementById("newBlock").addEventListener("keydown", function (event) {
        if (event.key == "Enter") {
            addBlock();
        }
    });

    function setBlockControlsDisabled(disabled) {
        document.querySelectorAll(".block-choice, #newBlock, #addBlockButton").forEach(function (e) {
            e.disabled = disabled;
        });
    }

    function saveChannelBlocks(names) {
        var ch = currentChannel;
        var row = rowFor(ch);
        var status = document.getElementById("blockStatus");
        var previousBlocks = row.blocks.slice();
        setBlockControlsDisabled(true);
        status.className = "small mt-1 text-muted";
        status.textContent = "Saving...";
        $.ajax({
            url: "/channel/blocks",
            method: "POST",
            traditional: true,
            data: { portal: ch.portal, channelId: ch.channelId, blocks: names }
        })
            .done(function (res) {
                row.blocks = res.blocks;
                res.allBlocks.forEach(function (name) {
                    if (allBlocks.indexOf(name) == -1) {
                        allBlocks.push(name);
                    }
                });
                status.className = "small mt-1 text-success";
                status.textContent = "Saved." + (res.plex ? " " + res.plex : "");
                channelChanged(row, previousBlocks);
            })
            .fail(function () {
                status.className = "small mt-1 text-danger";
                status.textContent = "Couldn't save. Try again.";
            })
            .always(function () {
                if (currentChannel && channelKey(currentChannel) == channelKey(row)) {
                    renderBlockChoices(row);
                }
                setBlockControlsDisabled(false);
            });
    }

    // ---- One channel's guide: in the player (now/next and a schedule) and from channel lists.
    var guides = {};
    var GUIDE_KEEP_MS = 600000;
    var guideOpen = false;
    var guideModal = null;
    var guideModalSource = null;

    function channelGuide(ch) {
        var key = channelKey(ch);
        var cached = guides[key];
        if (cached && Date.now() - cached.time < GUIDE_KEEP_MS) {
            return $.Deferred().resolve(cached.programmes).promise();
        }
        return $.getJSON("/channel/guide", { portal: ch.portal, channelId: ch.channelId }).then(function (res) {
            guides[key] = { time: Date.now(), programmes: res.programmes };
            return res.programmes;
        });
    }

    function clock(seconds) {
        return new Date(seconds * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function dayLabel(seconds) {
        var day = new Date(seconds * 1000);
        var today = new Date();
        var tomorrow = new Date();
        tomorrow.setDate(today.getDate() + 1);
        return day.toDateString() == today.toDateString() ? "Today"
            : day.toDateString() == tomorrow.toDateString() ? "Tomorrow"
                : day.toLocaleDateString([], { weekday: "short" });
    }

    function upcomingProgrammes(programmes) {
        var now = Date.now() / 1000;
        return programmes.filter(function (p) { return p.stop > now; });
    }

    function programmeList(programmes) {
        var now = Date.now() / 1000;
        var upcoming = upcomingProgrammes(programmes);
        if (!upcoming.length) {
            return '<p class="small text-muted mb-0">No guide information for this channel.</p>';
        }
        return upcoming.map(function (p) {
            var when = p.start <= now
                ? '<span class="badge bg-success me-1">Now</span>until ' + clock(p.stop)
                : escapeAttr(dayLabel(p.start) + " " + clock(p.start) + " - " + clock(p.stop));
            return '<div class="programme"><div class="small text-muted">' + when + '</div>' +
                '<div class="fw-bold">' + escapeAttr(p.title) + '</div>' +
                (p.desc ? '<div class="small text-muted programme-desc">' + escapeAttr(p.desc) + '</div>' : '') + '</div>';
        }).join("");
    }

    function nowAndNext(programmes) {
        var now = Date.now() / 1000;
        var upcoming = upcomingProgrammes(programmes);
        var current = upcoming.length && upcoming[0].start <= now ? upcoming[0] : null;
        var next = current ? upcoming[1] : upcoming[0];
        var parts = [];
        if (current) {
            parts.push("Now: " + current.title + " (until " + clock(current.stop) + ")");
        }
        if (next) {
            parts.push("Next: " + clock(next.start) + " " + next.title);
        }
        return parts.join("  \u00b7  ");
    }

    // Fill in the player's now/next line, and its schedule if that's open.
    function showPlayerGuide(loading) {
        var ch = currentChannel;
        if (!ch) {
            return;
        }
        var line = document.getElementById("nowShowing");
        var box = document.getElementById("playerGuide");
        if (guideOpen && loading) {
            box.innerHTML = '<p class="small text-muted mb-0"><i class="fa fa-spinner fa-spin"></i> Loading the guide...</p>';
        }
        var stillPlaying = function () { return currentChannel && channelKey(currentChannel) == channelKey(ch); };
        channelGuide(ch)
            .done(function (programmes) {
                if (!stillPlaying()) {
                    return;
                }
                line.textContent = nowAndNext(programmes);
                line.title = line.textContent;
                if (guideOpen) {
                    box.innerHTML = programmeList(programmes);
                }
            })
            .fail(function () {
                if (stillPlaying() && guideOpen) {
                    box.innerHTML = '<p class="small text-danger mb-0">Couldn\'t load the guide. Try again in a moment.</p>';
                }
            });
    }

    function togglePlayerGuide() {
        guideOpen = !guideOpen;
        document.getElementById("playerGuide").classList.toggle("d-none", !guideOpen);
        var button = document.getElementById("guideButton");
        button.classList.toggle("btn-info", guideOpen);
        button.classList.toggle("btn-outline-info", !guideOpen);
        showPlayerGuide(true);
        wakeOverlay();
    }

    // Keep "Now" and "Next" current as programmes end (from the kept copy, no request).
    setInterval(function () { showPlayerGuide(false); }, 60000);

    function showChannelGuide(ele) {
        var ch = { portal: ele.getAttribute("data-portal"), channelId: ele.getAttribute("data-channelId") };
        var row = rowFor(ch);
        guideModalSource = ele;
        document.getElementById("channelGuideTitle").textContent = row ? (row.customChannelName || row.channelName) : "Guide";
        var body = document.getElementById("channelGuideBody");
        body.innerHTML = '<p class="small text-muted mb-0"><i class="fa fa-spinner fa-spin"></i> Loading the guide...</p>';
        if (!guideModal) {
            guideModal = new bootstrap.Modal(document.getElementById("channelGuideModal"));
        }
        guideModal.show();
        channelGuide(ch)
            .done(function (programmes) {
                if (guideModalSource == ele) {
                    body.innerHTML = programmeList(programmes);
                }
            })
            .fail(function () {
                if (guideModalSource == ele) {
                    body.innerHTML = '<p class="small text-danger mb-0">Couldn\'t load the guide. Try again in a moment.</p>';
                }
            });
    }

    function playFromGuide() {
        guideModal.hide();
        selectChannel(guideModalSource);
    }
</script>
