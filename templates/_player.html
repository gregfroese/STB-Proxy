<!-- Channel preview, docked in the corner so the page stays usable while it plays.
     Shared by the editor, blocks and guide pages.
     A page that includes this defines rowFor(ch), returning the channel's data row
     ({portal, channelId, channelName, customChannelName, link, dead, favourite, blocks}) or null,
     and channelChanged(row, previousBlocks), called after a dead mark, favourite or the
     channel's blocks are saved (previousBlocks is only passed when the blocks changed).
     Channel up/down moves through the play buttons inside the .channel-list element the
     channel was started from, unless the page defines channelList(), returning its channels
     in order, and optionally channelShown(ch), called when a channel starts playing, and
     channelNodes(), returning list rows that aren't in the page (other table pages).
     The page passes allBlocks, every block name, to the template. -->
<style>
    .player-panel {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: min(440px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        z-index: 1040;
        background-color: #2c3034;
        border: 1px solid #495057;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.6);
    }
    .player-panel .text-muted {
        color: #adb5bd !important;
    }
    .player-panel.minimised .player-controls {
        display: none;
    }
    .play-button.playing {
        box-shadow: 0 0 0 0.2rem #ffc107;
    }
</style>

<div class="player-panel text-light d-none" id="playerPanel" role="region" aria-labelledby="channelLabel">
    <div class="d-flex align-items-center p-2">
        <span class="fw-bold text-truncate me-2" id="channelLabel">Channel</span>
        <button type="button" class="btn btn-sm btn-outline-light ms-auto" id="channelDown"
            onclick="changeChannel(-1)" title="Channel down: previous in the list (Page Down)"><i class="fa fa-chevron-down"></i></button>
        <button type="button" class="btn btn-sm btn-outline-light ms-1" id="channelUp"
            onclick="changeChannel(1)" title="Channel up: next in the list (Page Up)"><i class="fa fa-chevron-up"></i></button>
        <button type="button" class="btn btn-sm btn-outline-warning ms-1" id="favouriteButton"
            onclick="toggleFavourite()" title="Favourite"><i class="fa fa-star-o"></i></button>
        <button type="button" class="btn btn-sm btn-outline-light ms-1" id="minimiseButton"
            onclick="toggleMinimised()" title="Hide controls"><i class="fa fa-window-minimize"></i></button>
        <button type="button" class="btn btn-sm btn-outline-light ms-1" id="closePlayer"
            onclick="closePlayer()" title="Stop and close"><i class="fa fa-times"></i></button>
    </div>
    <video width="100%" id="player" class="d-block bg-black" controls autoplay>
        Your browser does not support HTML video.
    </video>
    <div class="player-controls p-2">
        <div class="small text-muted mb-1">Blocks</div>
        <div id="blockChoices" data-blocks='{{ allBlocks|tojson }}'></div>
        <div class="input-group input-group-sm mt-2" style="max-width: 320px;">
            <input type="text" class="form-control" id="newBlock" placeholder="New block">
            <button class="btn btn-outline-light" type="button" id="addBlockButton" onclick="addBlock()">Add</button>
        </div>
        <div id="blockStatus" class="small mt-1"></div>
        <div class="d-flex align-items-center flex-wrap mt-2">
            <span id="previewProblem" class="me-auto small text-warning d-none">This channel didn't play. The portal may just be busy: try again in a few seconds before marking it dead.
                <button type="button" class="btn btn-sm btn-outline-warning ms-1" id="retryPreview" onclick="retryPreview()">Try again</button>
            </span>
            <span id="deadStatus" class="me-auto small"></span>
            <button type="button" class="btn btn-sm btn-danger ms-auto mt-1" id="deadButton" onclick="toggleDead()">Mark dead</button>
        </div>
    </div>
</div>

<script>
    var player = document.getElementById("player");
    var title = document.getElementById("channelLabel");
    player.volume = 0.25;
    var currentChannel = null;
    var currentLink = "";
    var previewTimer = null;
    var allBlocks = JSON.parse(document.getElementById("blockChoices").getAttribute("data-blocks"));

    function escapeAttr(s) {
        return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function channelKey(row) {
        return row.portal + '/' + row.channelId;
    }

    function playButton(row) {
        var playing = currentChannel && channelKey(currentChannel) == channelKey(row);
        return '<button class="btn btn-success btn-block play-button' + (playing ? ' playing' : '') + '" title="Play" ' +
            'onclick="selectChannel(this)" data-key="' + escapeAttr(channelKey(row)) + '" ' +
            'data-portal="' + escapeAttr(row.portal) + '" data-channelId="' + escapeAttr(row.channelId) + '">' +
            '<i class="fa fa-play"></i></button>';
    }

    function deadToggle(row) {
        return '<button class="btn btn-link p-0 dead-toggle ' + (row.dead ? 'text-danger' : 'text-secondary') + '" ' +
            'title="' + (row.dead ? 'Dead: click to mark working' : 'Mark dead') + '" onclick="deadClicked(this)" ' +
            'data-key="' + escapeAttr(channelKey(row)) + '" data-portal="' + escapeAttr(row.portal) + '" ' +
            'data-channelId="' + escapeAttr(row.channelId) + '"><i class="fa fa-ban"></i></button>';
    }

    function favouriteStar(row) {
        return '<button class="btn btn-link text-warning p-0 fav-star" title="Favourite" onclick="starClicked(this)" ' +
            'data-key="' + escapeAttr(channelKey(row)) + '" data-portal="' + escapeAttr(row.portal) + '" ' +
            'data-channelId="' + escapeAttr(row.channelId) + '">' +
            '<i class="fa ' + (row.favourite ? 'fa-star' : 'fa-star-o') + '"></i></button>';
    }

    function deadBadge(row) {
        return '<span class="badge bg-danger ms-2 dead-badge' + (row.dead ? '' : ' d-none') + '" ' +
            'data-key="' + escapeAttr(channelKey(row)) + '">dead</span>';
    }

    var streamSeq = 0;
    var retried = false;
    var BUSY_MESSAGE = "Portal busy, trying again...";

    function stopStream() {
        streamSeq++;
        clearTimeout(previewTimer);
        // Dropping the source closes the stream, which frees the portal connection.
        player.pause();
        player.removeAttribute("src");
        player.load();
    }

    function startStream(delay) {
        var seq = ++streamSeq;
        setTimeout(function () {
            if (seq != streamSeq) {
                return;  // another channel was picked, or the player closed, meanwhile
            }
            player.src = currentLink;
            previewTimer = setTimeout(previewFailed, 15000);
        }, delay);
    }

    var currentList = null;
    var lastListIndex = 0;

    function selectChannel(ele) {
        currentList = ele.closest(".channel-list");
        playChannel({ portal: ele.getAttribute('data-portal'), channelId: ele.getAttribute('data-channelId') });
    }

    // The channels channel up/down moves through, in order, each listed once.
    function listedChannels() {
        var channels;
        if (typeof channelList == "function") {
            channels = channelList();
        } else {
            var scope = currentList && document.body.contains(currentList) ? currentList : document;
            channels = Array.prototype.map.call(scope.querySelectorAll(".play-button"), function (b) {
                return { portal: b.getAttribute("data-portal"), channelId: b.getAttribute("data-channelId") };
            });
        }
        var seen = {};
        return channels.filter(function (ch) {
            var key = channelKey(ch);
            if (seen[key]) {
                return false;  // the guide can list a channel once per programme
            }
            seen[key] = true;
            return true;
        });
    }

    function indexIn(channels, ch) {
        for (var i = 0; i < channels.length; i++) {
            if (channelKey(channels[i]) == channelKey(ch)) {
                return i;
            }
        }
        return -1;
    }

    function changeChannel(step) {
        if (!currentChannel) {
            return;
        }
        var channels = listedChannels();
        if (!channels.length) {
            return;
        }
        var index = indexIn(channels, currentChannel);
        // If the channel has left the list (say it was just put in a block while blocks are
        // hidden), carry on from the place it had.
        var target = index == -1 ? (step > 0 ? lastListIndex : lastListIndex - 1) : index + step;
        target = ((target % channels.length) + channels.length) % channels.length;
        playChannel(channels[target]);
    }

    document.addEventListener("keydown", function (event) {
        if (!currentChannel || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) {
            return;
        }
        if (event.key == "PageUp" || event.key == "PageDown") {
            event.preventDefault();
            changeChannel(event.key == "PageUp" ? 1 : -1);
        }
    });

    function markPlaying() {
        var key = currentChannel ? channelKey(currentChannel) : null;
        var roots = [document].concat(typeof channelNodes == "function" ? channelNodes() : []);
        roots.forEach(function (root) {
            root.querySelectorAll(".play-button").forEach(function (b) {
                b.classList.toggle("playing", b.getAttribute("data-key") == key);
            });
        });
    }

    function playChannel(ch) {
        var row = rowFor(ch);
        if (!row) {
            return;
        }
        var index = indexIn(listedChannels(), row);
        if (index != -1) {
            lastListIndex = index;
        }
        stopStream();
        currentChannel = { portal: row.portal, channelId: row.channelId };
        currentLink = row.link;
        retried = false;
        // No need to wait for the last stream to close: the server stops it for us.
        startStream(0);
        showPlayer();
        title.textContent = row.customChannelName || row.channelName;
        showDeadState(row.dead);
        showFavouriteState(row.favourite);
        renderBlockChoices(row);
        document.getElementById("blockStatus").textContent = "";
        document.getElementById("newBlock").value = "";
        document.getElementById("previewProblem").classList.add("d-none");
        document.getElementById("deadStatus").textContent = "";
        markPlaying();
        if (typeof channelShown == "function") {
            channelShown(row);
        }
    }

    player.addEventListener("playing", function () {
        clearTimeout(previewTimer);
        var status = document.getElementById("deadStatus");
        if (status.textContent == BUSY_MESSAGE) {
            status.textContent = "";
        }
    });

    player.addEventListener("error", function () {
        if (currentChannel && player.getAttribute("src")) {
            previewFailed();
        }
    });

    var panel = document.getElementById("playerPanel");

    function showPlayer() {
        if (panel.classList.contains("d-none") && window.innerHeight < 700) {
            // On a short screen the controls would cover the page; start with just the video.
            setMinimised(true);
        }
        panel.classList.remove("d-none");
        reservePlayerSpace();
    }

    // Leave room under the page so the player never hides the last rows.
    function reservePlayerSpace() {
        document.body.style.paddingBottom = panel.classList.contains("d-none") ? "" : (panel.offsetHeight + 32) + "px";
    }

    if (window.ResizeObserver) {
        new ResizeObserver(reservePlayerSpace).observe(panel);
    }

    function closePlayer() {
        currentChannel = null;
        markPlaying();
        stopStream();
        panel.classList.add("d-none");
        reservePlayerSpace();
    }

    function toggleMinimised() {
        setMinimised(!panel.classList.contains("minimised"));
    }

    function setMinimised(minimised) {
        panel.classList.toggle("minimised", minimised);
        var button = document.getElementById("minimiseButton");
        button.innerHTML = '<i class="fa ' + (minimised ? 'fa-window-restore' : 'fa-window-minimize') + '"></i>';
        button.title = minimised ? "Show controls" : "Hide controls";
    }

    function previewFailed() {
        clearTimeout(previewTimer);
        if (!currentChannel) {
            return;
        }
        var row = rowFor(currentChannel);
        if (!row || row.dead) {
            return;
        }
        if (!retried) {
            // Usually the portal connection is still busy with the last stream: try once more.
            retried = true;
            stopStream();
            document.getElementById("deadStatus").textContent = BUSY_MESSAGE;
            startStream(3000);
            return;
        }
        document.getElementById("deadStatus").textContent = "";
        document.getElementById("previewProblem").classList.remove("d-none");
        setMinimised(false);
    }

    function retryPreview() {
        document.getElementById("previewProblem").classList.add("d-none");
        stopStream();
        startStream(0);
    }

    function showDeadState(dead) {
        var button = document.getElementById("deadButton");
        button.textContent = dead ? "Mark working" : "Mark dead";
        button.className = (dead ? "btn btn-sm btn-success" : "btn btn-sm btn-danger") + " ms-auto mt-1";
    }

    function showFavouriteState(favourite) {
        var button = document.getElementById("favouriteButton");
        button.innerHTML = '<i class="fa ' + (favourite ? 'fa-star' : 'fa-star-o') + '"></i>';
        button.title = favourite ? "Remove from favourites" : "Add to favourites";
        button.className = favourite ? "btn btn-sm btn-warning ms-1" : "btn btn-sm btn-outline-warning ms-1";
    }

    // Mark a channel dead or working (the opposite of what it is now), from the player or a list.
    function setDead(ch, button, done) {
        var row = rowFor(ch);
        if (!row) {
            return;
        }
        button.disabled = true;
        $.post("/channel/dead", { portal: ch.portal, channelId: ch.channelId, dead: row.dead ? "false" : "true" })
            .done(function (res) {
                row.dead = res.dead;
                var key = channelKey(row);
                document.querySelectorAll('.dead-badge[data-key="' + key + '"]').forEach(function (badge) {
                    badge.classList.toggle("d-none", !res.dead);
                });
                document.querySelectorAll('.dead-toggle[data-key="' + key + '"]').forEach(function (toggle) {
                    toggle.classList.toggle("text-danger", res.dead);
                    toggle.classList.toggle("text-secondary", !res.dead);
                    toggle.title = res.dead ? "Dead: click to mark working" : "Mark dead";
                });
                if (currentChannel && channelKey(currentChannel) == key) {
                    showDeadState(res.dead);
                    document.getElementById("previewProblem").classList.add("d-none");
                }
                if (done) {
                    done(res);
                }
                channelChanged(row);
            })
            .fail(function () {
                if (done) {
                    done(null);
                } else {
                    alert("Couldn't save. Try again.");
                }
            })
            .always(function () {
                button.disabled = false;
            });
    }

    function toggleDead() {
        var status = document.getElementById("deadStatus");
        setDead(currentChannel, document.getElementById("deadButton"), function (res) {
            status.textContent = !res ? "Couldn't save. Try again."
                : (res.dead ? "Marked dead." : "Marked working.") + (res.plex ? " " + res.plex : "");
        });
    }

    function deadClicked(ele) {
        setDead({ portal: ele.getAttribute('data-portal'), channelId: ele.getAttribute('data-channelId') }, ele);
    }

    function setFavourite(ch, button) {
        var row = rowFor(ch);
        if (!row) {
            return;
        }
        button.disabled = true;
        $.post("/channel/favourite", { portal: ch.portal, channelId: ch.channelId, favourite: row.favourite ? "false" : "true" })
            .done(function (res) {
                row.favourite = res.favourite;
                document.querySelectorAll('.fav-star[data-key="' + channelKey(row) + '"] i').forEach(function (icon) {
                    icon.className = 'fa ' + (res.favourite ? 'fa-star' : 'fa-star-o');
                });
                if (currentChannel && channelKey(currentChannel) == channelKey(row)) {
                    showFavouriteState(res.favourite);
                }
                channelChanged(row);
            })
            .fail(function () {
                alert("Couldn't save the favourite. Try again.");
            })
            .always(function () {
                button.disabled = false;
            });
    }

    function toggleFavourite() {
        setFavourite(currentChannel, document.getElementById("favouriteButton"));
    }

    function starClicked(ele) {
        setFavourite({ portal: ele.getAttribute('data-portal'), channelId: ele.getAttribute('data-channelId') }, ele);
    }

    function renderBlockChoices(row) {
        var container = document.getElementById("blockChoices");
        container.innerHTML = "";
        var names = allBlocks.slice();
        row.blocks.forEach(function (name) {
            if (names.indexOf(name) == -1) {
                names.push(name);
            }
        });
        names.sort(function (a, b) { return a.localeCompare(b); });
        if (!names.length) {
            container.innerHTML = '<span class="small text-muted">No blocks yet. Add one below.</span>';
        }
        names.forEach(function (name, i) {
            var div = document.createElement("div");
            div.className = "form-check form-check-inline";
            var input = document.createElement("input");
            input.type = "checkbox";
            input.className = "form-check-input block-choice";
            input.id = "blockChoice" + i;
            input.value = name;
            input.checked = row.blocks.indexOf(name) != -1;
            input.onchange = blockChoiceChanged;
            var label = document.createElement("label");
            label.className = "form-check-label";
            label.htmlFor = input.id;
            label.textContent = name;
            div.appendChild(input);
            div.appendChild(label);
            container.appendChild(div);
        });
    }

    function checkedBlocks() {
        var names = [];
        document.querySelectorAll(".block-choice").forEach(function (input) {
            if (input.checked) {
                names.push(input.value);
            }
        });
        return names;
    }

    function blockChoiceChanged() {
        saveChannelBlocks(checkedBlocks());
    }

    function addBlock() {
        var input = document.getElementById("newBlock");
        var names = checkedBlocks();
        input.value.split(",").forEach(function (name) {
            name = name.trim();
            if (name && names.indexOf(name) == -1) {
                names.push(name);
            }
        });
        input.value = "";
        saveChannelBlocks(names);
    }

    document.getElementById("newBlock").addEventListener("keydown", function (event) {
        if (event.key == "Enter") {
            addBlock();
        }
    });

    function setBlockControlsDisabled(disabled) {
        document.querySelectorAll(".block-choice, #newBlock, #addBlockButton").forEach(function (e) {
            e.disabled = disabled;
        });
    }

    function saveChannelBlocks(names) {
        var ch = currentChannel;
        var row = rowFor(ch);
        var status = document.getElementById("blockStatus");
        var previousBlocks = row.blocks.slice();
        setBlockControlsDisabled(true);
        status.className = "small mt-1 text-muted";
        status.textContent = "Saving...";
        $.ajax({
            url: "/channel/blocks",
            method: "POST",
            traditional: true,
            data: { portal: ch.portal, channelId: ch.channelId, blocks: names }
        })
            .done(function (res) {
                row.blocks = res.blocks;
                res.allBlocks.forEach(function (name) {
                    if (allBlocks.indexOf(name) == -1) {
                        allBlocks.push(name);
                    }
                });
                status.className = "small mt-1 text-success";
                status.textContent = "Saved." + (res.plex ? " " + res.plex : "");
                channelChanged(row, previousBlocks);
            })
            .fail(function () {
                status.className = "small mt-1 text-danger";
                status.textContent = "Couldn't save. Try again.";
            })
            .always(function () {
                if (currentChannel && channelKey(currentChannel) == channelKey(row)) {
                    renderBlockChoices(row);
                }
                setBlockControlsDisabled(false);
            });
    }
</script>
