{% extends "base.html" %}
{% block content %}

<div class="page--full">
    <div class="d-flex align-items-center">
        <h4 class="mb-0">Active streams</h4>
        <span class="badge bg-secondary ms-2" id="streamCount">0</span>
        <div class="ms-auto small text-body-secondary">Tuners in use, who is watching, and from where.</div>
    </div>
    <hr>
    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" id="streamOut"></div>
</div>

<script>
    var streamingURL = "{{ url_for('streaming') }}";

    function duration(start) {
        var diff = Date.now() - start * 1000;
        var d = new Date(diff);
        var h = d.getUTCHours(), m = d.getUTCMinutes(), s = d.getUTCSeconds();
        return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function kindBadges(kinds) {
        var labels = { client: "client", recording: "recording", preview: "preview" };
        var colours = { client: "bg-success", recording: "bg-danger", preview: "bg-warning text-dark" };
        return (kinds || []).map(function (k) {
            return '<span class="badge ' + (colours[k] || "bg-secondary") + ' ms-1">' + (labels[k] || k) + "</span>";
        }).join("");
    }

    function row(icon, value) {
        return '<tr><td class="pe-2"><i class="bi ' + icon + '"></i></td>' +
            '<td><p class="card-text text-nowrap mb-0">' + value + "</p></td></tr>";
    }

    function esc(text) {
        var div = document.createElement("div");
        div.textContent = text == null ? "" : String(text);
        return div.innerHTML;
    }

    function update() {
        fetch(streamingURL).then(function (r) { return r.json(); }).then(function (json) {
            var cards = [];
            var total = 0;

            for (var portal in json) {
                for (var i = 0; i < json[portal].length; i++) {
                    var s = json[portal][i];
                    total++;
                    var who = s["account"] ? s["account"] : s["client"];
                    var ip = s["account"] ? " (" + esc(s["client"]) + ")" : "";
                    var sharing = s["viewers"] > 1
                        ? ' <span class="badge bg-info text-dark ms-1" title="Players sharing this portal connection">' +
                          s["viewers"] + " viewers</span>"
                        : "";

                    cards.push(
                        '<div class="col"><div class="card text-dark bg-light h-100">' +
                        '<div class="card-header d-flex align-items-center">' +
                        '<i class="bi bi-person-fill me-2"></i>' + esc(who) + ip +
                        '<span class="ms-auto">' + kindBadges(s["kinds"]) + sharing +
                        '<button class="btn btn-sm btn-outline-danger ms-2" data-stop data-portal="' +
                        esc(portal) + '" data-channel="' + esc(s["channel id"]) +
                        '" title="Stop this stream and free its tuner"><i class="bi bi-stop-fill"></i></button>' +
                        "</span></div>" +
                        '<div class="card-body"><table class="table table-sm mb-0">' +
                        row("bi-play-fill", esc(s["channel name"])) +
                        row("bi-server", esc(s["portal name"])) +
                        row("bi-lock-fill", esc((s["mac"] || "").toUpperCase())) +
                        row("bi-clock", duration(s["start time"])) +
                        "</table></div></div></div>"
                    );
                }
            }

            document.getElementById("streamCount").textContent = total;
            document.getElementById("streamOut").innerHTML = cards.length
                ? cards.join("")
                : '<div class="col"><p class="text-body-secondary">No active streams.</p></div>';
        });
    }

    update();
    setInterval(update, 2000);

    document.getElementById("streamOut").addEventListener("click", function (event) {
        var button = event.target.closest("[data-stop]");
        if (!button) return;
        button.disabled = true;
        fetch("/streams/stop", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
                portal: button.dataset.portal,
                channel: button.dataset.channel,
            }),
        })
            .then(update)
            .catch(function () { button.disabled = false; });
    });
</script>

{% endblock %}
