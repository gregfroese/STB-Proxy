{% extends "base.html" %}
{% block content %}

<style>
    #accountOut .text-muted {
        color: #adb5bd !important;
    }
</style>

<div class="container-fluid text-light p-lg-5">
    <div class="d-flex align-items-center">
        <h4 class="mb-0">Account activity</h4>
        <button type="button" class="btn btn-outline-light btn-sm ms-auto" id="checkAccount" onclick="checkAccount()"
            title="Ask the portal now (one request per MAC)"><i class="fa fa-refresh"></i> Check now</button>
    </div>
    <hr>
    <p class="small text-muted">Whether anything else is using your MACs: another STB-Proxy, an app, or a box. Updated
        whenever STB-Proxy logs in to the portal; <b>Check now</b> asks straight away.</p>
    <div class="row row-cols-auto" id="accountOut"></div>

    <br>

    <h4>Streaming</h4>
    <hr>
    <div class="container-fluid">

        <div class="row row-cols-auto" id="streamOut">

        </div>

    </div>

    <br>
    <br>

    <h4>Log</h4>
    <hr>
    <div class="p-sm-3">
        <div class="row row-cols-auto mb-2">
            <span class="col">Autoscroll:</span>
            <div class="form-check form-switch col">
                <input type="checkbox" class="checkbox form-check-input" id="autoscroll" checked>
            </div>
        </div>
        <pre class="border p-3" style="height: 40pc; overflow-y: scroll;" id="logOut"></pre>
    </div>
</div>

<script>
    // Account activity
    function ago(seconds) {
        var s = Math.max(0, Date.now() / 1000 - seconds);
        if (s < 90) return "just now";
        if (s < 5400) return Math.round(s / 60) + " min ago";
        if (s < 172800) return Math.round(s / 3600) + " h ago";
        return Math.round(s / 86400) + " days ago";
    }

    function when(seconds) {
        return new Date(seconds * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function macCard(portal, m) {
        var html = '<div class="col mb-3"><div class="card bg-dark border-secondary text-light" style="min-width: 300px;">' +
            '<div class="card-header">' + esc(portal) + ' <span class="text-muted">MAC &hellip;' + esc(m.mac.slice(-5)) + '</span></div>' +
            '<div class="card-body small">';
        if (!m.checked) {
            return html + '<span class="text-muted">Not checked yet. Press Check now.</span></div></div></div>';
        }
        var others = m.otherLogins.length;
        html += others
            ? '<div class="text-warning mb-2"><i class="fa fa-exclamation-triangle"></i> Something else logged in with this MAC ' +
              (others == 1 ? 'once' : others + ' times') + ' in the last 24 h, most recently ' + esc(ago(m.otherLogins[others - 1])) +
              ' (' + esc(when(m.otherLogins[others - 1])) + ').</div>'
            : '<div class="text-success mb-2"><i class="fa fa-check"></i> No other logins with this MAC since ' + esc(when(m.watchingSince)) + '.</div>';
        html += m.boxOn
            ? '<div class="text-warning mb-2"><i class="fa fa-television"></i> A box or emulator is on: it checked in ' + esc(ago(m.boxCheckIn)) + '.</div>'
            : '<div class="mb-2"><i class="fa fa-television"></i> No box or emulator on' +
              (m.boxCheckIn ? ' (last checked in ' + esc(when(m.boxCheckIn)) + ')' : '') + '.</div>';
        if (m.boxWatching) {
            html += '<div class="text-muted mb-2">A box last watched ' + (m.boxWatchingType ? esc(m.boxWatchingType) + ': ' : '') +
                '<b>' + esc(m.boxWatching) + '</b>' + (m.boxWatchingSince ? ' from ' + esc(when(m.boxWatchingSince)) : '') + '.</div>';
        }
        return html + '<div class="text-muted">Checked ' + esc(ago(m.checked)) + '.</div></div></div></div>';
    }

    function showAccount(portals) {
        var html = '';
        portals.forEach(function (p) {
            p.macs.forEach(function (m) { html += macCard(p.portal, m); });
        });
        document.getElementById('accountOut').innerHTML = html || '<span class="text-muted">No enabled portals.</span>';
    }

    function loadAccount() {
        fetch("/account/activity").then(function (r) { return r.json(); }).then(showAccount);
    }

    function checkAccount() {
        var button = document.getElementById('checkAccount');
        button.disabled = true;
        fetch("/account/check", { method: "POST" })
            .then(function (r) { return r.json(); })
            .then(showAccount)
            .finally(function () {
                // Portals can refuse logins that come too close together.
                setTimeout(function () { button.disabled = false; }, 30000);
            });
    }

    loadAccount();
    setInterval(loadAccount, 60000);

    // Log
    var logURL = "{{ url_for('log') }}";
    var logOut = document.getElementById('logOut');
    var autoscroll = document.getElementById('autoscroll');
    setInterval(function updateLog() {
        fetch(logURL)
            .then(function (response) {
                return response.text();
            })
            .then(function (text) {
                logOut.textContent = text;
                if (autoscroll.checked) {
                    logOut.scrollTop = logOut.scrollHeight;
                }
            })
        return updateLog;
    }(), 2000);

    // Streaming
    var streamingURL = "{{ url_for('streaming') }}";
    var streamOut = document.getElementById('streamOut');
    setInterval(function updateStreaming() {

        fetch(streamingURL)
            .then(function (response) {
                return response.json();
            })
            .then(function (json) {

                var codeBlock = ''

                for (var portal in json) {
                    for (const stream of json[portal]) {
                        var portal = stream["portal name"]
                        var mac = stream["mac"].toUpperCase()
                        var client = stream["client"]
                        var channel = stream["channel name"]
                        var start = stream["start time"] * 1000
                        var now = Date.now()
                        var timeDifference = now - start;
                        var differenceDate = new Date(timeDifference);
                        var diffHours = differenceDate.getUTCHours();
                        var diffMinutes = differenceDate.getUTCMinutes();
                        var diffSeconds = differenceDate.getUTCSeconds();
                        var dur = String(diffHours).padStart(2, '0') + ':' + String(diffMinutes).padStart(2, '0') + ':' + String(diffSeconds).padStart(2, '0');

                        // Storing HTML code block in a variable
                        var codeBlock = codeBlock +
                            '<div class="col">' +
                            '<div class="card text-dark bg-light mb-3">' +
                            '<div class="card-header"><i class="me-2 fa fa-user"></i>' + client +
                            (stream["viewers"] > 1 ? ' <span class="badge bg-info text-dark ms-1" title="Players sharing this one portal connection">' +
                                stream["viewers"] + ' viewers</span>' : '') + '</div>' +
                            '<div class="card-body">' +
                            '<table class="table table-sm">' +
                            '<tr>' +
                            '<td>' +
                            '<i class="fa fa-play"></i>' +
                            '</td>' +
                            '<td>' +
                            '<p class="card-text text-nowrap">' + channel + '</p>' +
                            '</td>' +
                            '</tr>' +
                            '<tr>' +
                            '<td>' +
                            '<i class="fa fa-server"></i>' +
                            '</td>' +
                            '<td>' +
                            '<p class="card-text text-nowrap">' + portal + '</p>' +
                            '</td>' +
                            '</tr>' +
                            '<tr>' +
                            '<td>' +
                            '<i class="fa fa-lock"></i>' +
                            '</td>' +
                            '<td>' +
                            '<p class="card-text text-nowrap">' + mac + '</p>' +
                            '</td>' +
                            '<tr>' +
                            '<td>' +
                            '<i class="fa fa-clock-o"></i>' +
                            '</td>' +
                            '<td>' +
                            '<p class="card-text text-nowrap">' + dur + '</p>' +
                            '</td>' +
                            '</tr>' +
                            '</table>' +
                            '</div>' +
                            '</div>' +
                            '</div>';
                    }

                }

                // Inserting the code block to wrapper element
                document.getElementById("streamOut").innerHTML = codeBlock

            })
        return updateStreaming;
    }(), 1000);


</script>

{% endblock %}
