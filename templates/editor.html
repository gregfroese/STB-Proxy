{% extends "base.html" %}
{% block content %}

<div class="container-fluid table-responsive p-lg-5">
    <table id="table" class="table table-striped table-dark nowrap" width="100%">
        <thead>
            <tr>
                <th>
                    <div class="form-check form-switch">
                        <input type="checkbox" class="checkbox form-check-input" onchange="editAll(this)">
                    </div>
                </th>
                <th>Play</th>
                <th>Name</th>
                <th>Genre</th>
                <th>Block</th>
                <th>Number</th>
                <th>EPG ID</th>
                <th>Fallback For</th>
                <th>Portal</th>
                <th>Logo</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <form action="/editor/save" method="post" id="save edits" hidden>
        <input type="text" id="enabledEdits" name="enabledEdits" value="">
        <input type="text" id="numberEdits" name="numberEdits" value="">
        <input type="text" id="nameEdits" name="nameEdits" value="">
        <input type="text" id="genreEdits" name="genreEdits" value="">
        <input type="text" id="epgEdits" name="epgEdits" value="">
        <input type="text" id="fallbackEdits" name="fallbackEdits" value="">
        <input type="text" id="blockEdits" name="blockEdits" value="">
        <input type="text" id="logoEdits" name="logoEdits" value="">
    </form>

    <form action="/editor/reset" method="post" id="reset" hidden>
    </form>

    {% include "_player.html" %}

</div>

<script>
    var enabledEdits = [];
    var numberEdits = [];
    var nameEdits = [];
    var genreEdits = [];
    var epgEdits = [];
    var fallbackEdits = [];
    var blockEdits = [];
    var logoEdits = [];
    var table;

    function editAll(ele) {
        var checkboxes = document.getElementsByClassName('checkbox');
        var enable = ele.checked;
        for (var i = 0, n = checkboxes.length; i < n; i++) {
            if (i != 0) {
                checkboxes[i].checked = enable;
                checkboxes[i].onchange();
            }
        }
    }

    function editEnabled(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.checked;
        var j = { "portal": p, "channel id": i, "enabled": c };
        enabledEdits.push(j);
    }

    function editCustomNumber(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.value;
        var j = { "portal": p, "channel id": i, "custom number": c };
        numberEdits.push(j);
    }

    function editCustomName(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.value;
        var j = { "portal": p, "channel id": i, "custom name": c };
        nameEdits.push(j);
    }

    function editCustomGenre(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.value;
        var j = { "portal": p, "channel id": i, "custom genre": c };
        genreEdits.push(j);
    }

    function editCustomEpgId(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.value;
        var j = { "portal": p, "channel id": i, "custom epg id": c };
        epgEdits.push(j);
    }

    function editFallback(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var c = ele.value;
        var j = { "portal": p, "channel id": i, "channel name": c };
        fallbackEdits.push(j);
    }

    function editBlock(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        var j = { "portal": p, "channel id": i, "block": ele.value };
        blockEdits.push(j);
    }

    function editLogo(ele) {
        var p = ele.getAttribute('data-portal');
        var i = ele.getAttribute('data-channelId');
        logoEdits.push({ "portal": p, "channel id": i, "logo": ele.value });
        // Show the new logo straight away (or the automatic one again, if cleared).
        var row = rowFor({ portal: p, channelId: i });
        row.logo = ele.value.trim() || row.autoLogo;
        $(table.rows().nodes()).find('.name-logo[data-key="' + channelKey(row) + '"]').html(logoImage(row));
    }

    function save() {
        document.getElementById("enabledEdits").value = JSON.stringify(enabledEdits);
        document.getElementById("numberEdits").value = JSON.stringify(numberEdits);
        document.getElementById("nameEdits").value = JSON.stringify(nameEdits);
        document.getElementById("genreEdits").value = JSON.stringify(genreEdits);
        document.getElementById("epgEdits").value = JSON.stringify(epgEdits);
        document.getElementById("fallbackEdits").value = JSON.stringify(fallbackEdits);
        document.getElementById("blockEdits").value = JSON.stringify(blockEdits);
        document.getElementById("logoEdits").value = JSON.stringify(logoEdits);
        document.getElementById("save edits").submit();
    }

    function rowFor(ch) {
        var found = null;
        table.rows().every(function () {
            var d = this.data();
            if (d.portal == ch.portal && d.channelId == ch.channelId) {
                found = d;
            }
        });
        return found;
    }

    function channelChanged(row, previousBlocks) {
        if (previousBlocks) {
            // Saved from the preview: show it in the Block box and drop any unsaved edit there.
            $(table.rows().nodes()).find('.block-input[data-key="' + channelKey(row) + '"]').val(row.blocks.join(", "));
            blockEdits = blockEdits.filter(function (e) {
                return !(e.portal == row.portal && e["channel id"] == row.channelId);
            });
        }
        table.draw(false);
    }

    // Channel up/down follows the table as filtered and sorted.
    function channelList() {
        return table.rows({ search: 'applied', order: 'applied' }).data().toArray();
    }

    function channelNodes() {
        return table.rows().nodes().toArray();
    }

    // Turn to the table page the playing channel is on.
    function channelShown(ch) {
        var length = table.page.len();
        var index = indexIn(channelList(), ch);
        if (length > 0 && index != -1 && Math.floor(index / length) != table.page()) {
            table.page(Math.floor(index / length)).draw('page');
        }
    }

    var hideDead = true;
    var favouritesOnly = false;
    var hideInBlocks = false;
    $.fn.dataTable.ext.search.push(function (settings, data, dataIndex, rowData) {
        return (!hideDead || !rowData.dead) && (!favouritesOnly || rowData.favourite) &&
            (!hideInBlocks || !rowData.blocks.length);
    });

    /* Create an array with the values of all the checkboxes in a column */
    $.fn.dataTable.ext.order['dom-checkbox'] = function (settings, col) {
        return this.api().column(col, { order: 'index' }).nodes().map(function (td, i) {
            return $('input', td).prop('checked') ? '1' : '0';
        });
    };

    /* Create an array with the values of all the input boxes in a column, parsed as numbers */
    $.fn.dataTable.ext.order['dom-text-numeric'] = function (settings, col) {
        return this.api().column(col, { order: 'index' }).nodes().map(function (td, i) {
            var val = $('input', td).val();
            return val === '' ? $('input', td).attr('placeholder') : val * 1;
        });
    };

    /* Create an array with the values of all the text boxes in a column */
    $.fn.dataTable.ext.order['dom-text'] = function (settings, col) {
        return this.api().column(col, { order: 'index' }).nodes().map(function (td, i) {
            var val = $('input', td).val();
            return val === '' ? $('input', td).attr('placeholder') : val;
        });
    };

    $(document).ready(function () {
        table = $('#table').DataTable({
            dom: "<'row m-1'<'col-auto'B><'col-auto d-flex align-items-center dead-filter'><'col-auto ms-auto'f><'col-auto'l>>" +
                "<'row'<'col-12'tr>>" +
                "<'row mb-1 mb-lg-0'<'col-auto text-light'i><'col-auto ms-auto'p>>",
            orderFixed: [0, 'des'],
            order: [[0, 'des'], [2, 'asc']],
            pageLength: 25,
            initComplete: function () {
                $('div.dead-filter').html(
                    '<div class="form-check form-switch text-light mb-0">' +
                    '<input type="checkbox" class="form-check-input" id="hideDead" checked ' +
                    'onchange="hideDead = this.checked; table.draw(false);">' +
                    '<label class="form-check-label" for="hideDead">Hide dead</label></div>' +
                    '<div class="form-check form-switch text-light mb-0 ms-3">' +
                    '<input type="checkbox" class="form-check-input" id="favouritesOnly" ' +
                    'onchange="favouritesOnly = this.checked; table.draw(false);">' +
                    '<label class="form-check-label" for="favouritesOnly"><i class="fa fa-star text-warning"></i> Favourites only</label></div>' +
                    '<div class="form-check form-switch text-light mb-0 ms-3">' +
                    '<input type="checkbox" class="form-check-input" id="hideInBlocks" ' +
                    'onchange="hideInBlocks = this.checked; table.draw(false);">' +
                    '<label class="form-check-label" for="hideInBlocks">Hide channels in blocks</label></div>'
                );
            },
            lengthMenu: [[25, 50, 100, 250, 500, 1000, -1], [25, 50, 100, 250, 500, 1000, "All"]],
            columnDefs: [
                { targets: [0, 1], width: "0%" },
                { targets: 0, className: "align-middle", orderable: false, searchable: false, orderDataType: "dom-checkbox" },
                { targets: 1, className: "align-middle", orderable: false, searchable: false },
                { targets: 2, className: "align-middle", orderDataType: "dom-text", type: 'string' },
                { targets: 3, className: "align-middle", orderDataType: "dom-text", type: 'string' },
                { targets: 4, className: "align-middle", orderDataType: "dom-text", type: 'string' },
                { targets: 5, className: "align-middle", orderDataType: "dom-text-numeric" },
                { targets: 6, className: "align-middle", orderDataType: "dom-text", type: 'string' },
                { targets: 7, className: "align-middle", orderDataType: "dom-text", type: 'string' },
                { targets: 8, className: "align-middle" },
                { targets: 9, className: "align-middle", orderable: false, searchable: false }
            ],
            language: {
                search: "",
                searchPlaceholder: 'Filter',
                lengthMenu: "_MENU_",
            },
            buttons: {
                buttons: [
                    {
                        text: '<i class="fa fa-save"></i> Save',
                        titleAttr: 'Save',
                        className: "btn btn-success",
                        action: function () {
                            save();
                        }
                    },
                    {
                        text: '<i class="fa fa-undo"></i> Reset',
                        titleAttr: 'Reset',
                        className: "btn btn-danger",
                        action: function () {
                            if (confirm("Confirm Reset\nThis will clear all edits!") == true) {
                                document.getElementById('reset').submit();
                            }
                        }
                    }
                ],
            },
            ajax: {
                "url": "{{ url_for('editor_data') }}",
                "dataType": "json",
                "dataSrc": "data",
                "contentType": "application/json"
            },
            columns: [
                {
                    data: "enabled",
                    render: function (data, type, row, meta) {
                        let r = '<div \
                                class="form-check form-switch">\
                                <input \
                                type="checkbox" \
                                class="checkbox form-check-input" \
                                onchange="editEnabled(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '"'
                        if (data == true) {
                            r = r + ' checked';
                        }
                        r = r + '></div>'
                        return r
                    }
                },
                {
                    data: "link",
                    render: function (data, type, row, meta) {
                        return '<div class="d-flex align-items-center">' + playButton(row) +
                            '<span class="ms-2">' + favouriteStar(row) + '</span>' +
                            '<span class="ms-2">' + guideButton(row) + '</span>' +
                            '<span class="ms-2">' + deadToggle(row) + '</span></div>'
                    }
                },
                {
                    data: "channelName",
                    render: function (data, type, row, meta) {
                        return '<div class="d-flex align-items-center"><span class="name-logo me-2" data-key="' +
                                escapeAttr(channelKey(row)) + '">' + logoImage(row) + '</span><input \
                                type="text" \
                                class="form-control" \
                                style="min-width: 200px;" \
                                onchange="editCustomName(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '" \
                                placeholder="' + row.channelName + '" \
                                title="' + row.channelName + '" \
                                value="' + row.customChannelName +
                            '">' + deadBadge(row) + '</div>'
                    },
                },
                {
                    data: "genre",
                    render: function (data, type, row, meta) {
                        return '<input \
                                type="text" \
                                class="form-control" \
                                style="min-width: 200px;" \
                                onchange="editCustomGenre(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '" \
                                placeholder="' + row.genre + '" \
                                title="' + row.genre + '" \
                                value="' + row.customGenre +
                            '">'
                    },
                },
                {
                    data: "blocks",
                    render: function (data, type, row, meta) {
                        if (type === 'filter' || type === 'sort') {
                            return data.join(", ");
                        }
                        return '<input \
                                type="text" \
                                class="form-control block-input" \
                                style="min-width: 150px;" \
                                onchange="editBlock(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '" \
                                data-key="' + escapeAttr(channelKey(row)) + '" \
                                placeholder="No blocks" \
                                title="Separate blocks with commas" \
                                value="' + escapeAttr(data.join(", ")) +
                            '">'
                    },
                },
                {
                    data: "channelNumber",
                    render: function (data, type, row, meta) {
                        return '<input \
                                type="test" \
                                class="form-control" \
                                style="min-width: 100px;" \
                                onchange="editCustomNumber(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '" \
                                placeholder="' + row.channelNumber + '" \
                                title="' + row.channelNumber + '" \
                                value="' + row.customChannelNumber +
                            '">'
                    },
                },
                {
                    data: "channelId",
                    render: function (data, type, row, meta) {
                        return '<input \
                                type="text" \
                                class="form-control" \
                                style="min-width: 200px;" \
                                onchange="editCustomEpgId(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '" \
                                placeholder="' + row.portal + row.channelId + '" \
                                title="' + row.portal + row.channelId + '" \
                                value="' + row.customEpgId +
                            '">'
                    },
                },
                {
                    data: "fallbackChannel",
                    render: function (data, type, row, meta) {
                        return '<input \
                                type="text" \
                                class="form-control" \
                                style="min-width: 200px;" \
                                onchange="editFallback(this)" \
                                data-portal="' + row.portal + '" \
                                data-channelId="' + row.channelId + '" \
                                value="' + row.fallbackChannel +
                            '">'
                    }
                },
                { data: "portalName" },
                {
                    data: "customLogo",
                    render: function (data, type, row, meta) {
                        return '<input type="text" class="form-control" style="min-width: 220px;" onchange="editLogo(this)" ' +
                            'data-portal="' + escapeAttr(row.portal) + '" data-channelId="' + escapeAttr(row.channelId) + '" ' +
                            'placeholder="' + (row.autoLogo ? 'Automatic' : 'No logo found: paste an image URL') + '" ' +
                            'title="' + escapeAttr(row.autoLogo || '') + '" value="' + escapeAttr(data) + '">';
                    }
                },
            ],
        });
    });

</script>
{% endblock %}
